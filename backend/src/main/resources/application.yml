server:
  port: ${MIAPEVE_PORT:8787}
  address: 127.0.0.1

spring:
  application:
    name: miapeve-finance-backend
  datasource:
    url: jdbc:sqlite:${MIAPEVE_DB_PATH:./data/miapeve_finance.db}
    driver-class-name: org.sqlite.JDBC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.miapeve.finance: DEBUG

miapeve:
  db-path: ${MIAPEVE_DB_PATH:./data/miapeve_finance.db}
  cors:
    # En production Windows, la webview Tauri sert l'UI depuis l'origine
    # https://tauri.localhost (et non tauri://localhost, utilisée sur
    # macOS/Linux) : sans cette origine ici, le navigateur bloque les
    # requêtes CORS du frontend alors que le backend répond normalement.
    allowed-origins: ${MIAPEVE_FRONTEND_ORIGIN:tauri://localhost,https://tauri.localhost,http://localhost:1420,http://localhost:5173}
