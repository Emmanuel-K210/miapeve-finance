server:
  port: ${MIAPEVE_PORT:8787}
  address: 127.0.0.1

spring:
  application:
    name: miapeve-finance-backend
  datasource:
    url: jdbc:sqlite:${MIAPEVE_DB_PATH:./data/miapeve_finance.db}
    driver-class-name: org.sqlite.JDBC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.miapeve.finance: DEBUG

miapeve:
  db-path: ${MIAPEVE_DB_PATH:./data/miapeve_finance.db}
  cors:
    # L'origine exacte utilisée par la webview Tauri en production varie
    # selon l'OS et la version de Tauri (tauri://localhost sur macOS/Linux,
    # https://tauri.localhost sur Windows avec WebView2, et ça a déjà changé
    # d'une version à l'autre). Plutôt que de deviner la bonne valeur à
    # chaque régression, on autorise toutes les origines : l'API n'est de
    # toute façon accessible que depuis 127.0.0.1 (server.address dans ce
    # fichier) et n'utilise pas de cookies (allowCredentials reste à false),
    # donc un joker ne l'expose pas davantage.
    allowed-origins: ${MIAPEVE_FRONTEND_ORIGIN:*}
