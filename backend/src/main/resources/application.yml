server:
  port: ${MIAPEVE_PORT:8787}
  address: 127.0.0.1

spring:
  application:
    name: miapeve-finance-backend
  datasource:
    url: jdbc:sqlite:${MIAPEVE_DB_PATH:./data/miapeve_finance.db}
    driver-class-name: org.sqlite.JDBC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.miapeve.finance: DEBUG

miapeve:
  db-path: ${MIAPEVE_DB_PATH:./data/miapeve_finance.db}
  cors:
    # L'origine exacte utilisée par la webview Tauri en production varie
    # selon l'OS et la version de Tauri (tauri://localhost sur macOS/Linux ;
    # sur Windows avec WebView2 ça peut être http://tauri.localhost ou
    # https://tauri.localhost selon la version de Tauri — le précédent
    # correctif n'avait ajouté que la variante https, qui n'a pas suffi).
    # On liste toutes les variantes connues plutôt que de ne parier que sur
    # une seule.
    allowed-origins: ${MIAPEVE_FRONTEND_ORIGIN:tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:1420,http://localhost:5173}
